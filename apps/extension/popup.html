<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 9999px;
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #34d399;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-val {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
      color: #f8fafc;
    }
    .btn {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">AutoApply MV3 Agent</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="connStatus">Connected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Ready in Local Queue</div>
    <div class="card-val" id="queueCount">--</div>
  </div>

  <button class="btn" id="runBtn">⚡ Check & Apply Next Job</button>

  <div class="footer">
    Autonomous ATS Application Engine &bull; Local Execution Runner
  </div>

  <script src="popup.js"></script>
</body>
</html>
